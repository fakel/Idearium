[project]
name = "idearium-stt"
version = "0.1.0"
description = "Servidor local de transcripción (faster-whisper) compatible con la API de OpenAI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "faster-whisper>=1.1",
  "av>=11,<16",
  "nvidia-cublas-cu12>=12.4; sys_platform == 'linux'",
  "nvidia-cudnn-cu12>=9.1; sys_platform == 'linux'",
]

[tool.uv]
package = false
